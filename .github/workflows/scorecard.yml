name: OpenSSF Scorecard

on:
  push:
    branches: [main, agent/zero-operation-relay]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scorecard only analyzes the default branch; other branches skip cleanly
    # instead of pretending to have run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: scorecard-results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          if-no-files-found: warn
