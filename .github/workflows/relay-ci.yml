name: Relay CI

on:
  pull_request:
  push:
    branches: [main, agent/zero-operation-relay]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_MODE: report-only

jobs:
  build:
    name: Build Android and Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK and JVM artifacts
        run: ./gradlew :app:assembleDebug :pc-gateway:build :pc-gateway:installDist :broker:test --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-build-artifacts
          path: |
            app/build/outputs/apk/**/*.apk
            pc-gateway/build/libs/**
            pc-gateway/build/install/pc-gateway/**
          if-no-files-found: warn

  unit:
    name: Shared unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew :shared:jvmTest :app:testDebugUnitTest --no-daemon

  ui:
    name: Compose UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew :composeApp:desktopTest --no-daemon

  accessibility-contract:
    name: Accessibility and UI safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify security and runtime implementation contracts
        shell: pwsh
        run: ./scripts/verify-implementation-contracts.ps1
      - shell: pwsh
        run: ./scripts/check-accessibility.ps1
      - shell: pwsh
        run: ./test-lab/run-host-checks.ps1

  fuzz-regression:
    name: Deterministic decoder regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/run-jazzer.ps1 -Mode $env:SECURITY_MODE -OutputPath artifacts/jazzer -RequirePython
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-fuzz-regression
          path: artifacts/jazzer/
          if-no-files-found: warn

  apk-scan:
    name: APK static scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        env:
          MOBSF_URL: ${{ secrets.MOBSF_URL }}
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
        run: ./scripts/run-mobsf.ps1 -ArtifactPath distribution -OutputPath artifacts/mobsf.json -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-apk-scan
          path: artifacts/
          if-no-files-found: warn

  deps-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pin the toolchain action and scanner source versions. The bootstrap refuses an
      # unverified Go proxy/checksum configuration and fails rather than emitting PASS.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install pinned dependency-security scanners
        shell: bash
        run: bash ./scripts/install-security-tools.sh "$RUNNER_TEMP/relay-security-tools"
      - shell: pwsh
        run: ./scripts/run-syft.ps1 -SourcePath . -OutputPath artifacts/syft-sbom.json -SpdxOutputPath artifacts/syft-sbom.spdx.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - shell: pwsh
        run: ./scripts/run-osv.ps1 -SourcePath . -OutputPath artifacts/osv.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - shell: pwsh
        run: ./scripts/run-grype.ps1 -InputPath artifacts/syft-sbom.json -OutputPath artifacts/grype.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - name: Require complete dependency-security evidence
        if: always()
        shell: pwsh
        run: ./scripts/verify-security-evidence.ps1 -EvidencePaths artifacts/syft-sbom.json,artifacts/osv.json,artifacts/grype.json -OutputPath artifacts/dependency-security-evidence.json -RequireComplete -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-dependency-scan
          path: artifacts/
          if-no-files-found: warn

  sign-verify:
    name: Distribution verification
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        run: ./scripts/verify-distribution-signatures.ps1 -PackageRoot distribution -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-signature-verification
          path: artifacts/signature-verification.json
          if-no-files-found: warn

  security-evidence:
    name: Security evidence summary
    runs-on: ubuntu-latest
    needs: [apk-scan, deps-scan, sign-verify]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: relay-*
          path: evidence
          merge-multiple: true
      - shell: pwsh
        # In report-only mode, unavailable external services remain explicitly BLOCKED in the
        # artifact. The evidence script enforces completeness automatically in block-high-critical.
        run: ./scripts/verify-security-evidence.ps1 -EvidencePaths evidence/mobsf.json,evidence/syft-sbom.json,evidence/osv.json,evidence/grype.json,evidence/signature-verification.json -OutputPath evidence/security-evidence-summary.json -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-security-evidence-summary
          path: evidence/security-evidence-summary.json
          if-no-files-found: warn

  gateway-recovery:
    name: Gateway recovery and transport fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run gateway recovery contract tests
        run: python -m unittest discover tests/gateway-recovery -p '*_smoke.py' -v
      - name: Run BPv7 export contract tests
        run: python -m unittest discover gateway-bp7-export -p 'test_*.py' -v
      - name: Run Meshtastic adapter contract tests
        env:
          PYTHONPATH: gateway-meshtastic-adapter
        run: python -m unittest discover gateway-meshtastic-adapter/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-gateway-recovery
          path: tests/gateway-recovery/
          if-no-files-found: warn

  hardware-independent-contracts:
    name: Hardware-independent contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Mobly host contract unittest discovery
        run: python -m unittest discover -s test-lab/mobly -p '*_test.py' -v
      - name: Run BLE simulator unittest harness
        run: python tools/ble-sim/run_tests.py
      - name: Run deterministic decoder regression tests
        run: python -m unittest discover -s test-lab/fuzz -p 'decoder*_test.py' -v
      - name: Run municipal-pilot security contract tests
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Run TUF metadata chain contract tests
        run: python test-lab/tuf_metadata_test.py -v
