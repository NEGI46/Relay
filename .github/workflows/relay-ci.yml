name: Relay CI

on:
  pull_request:
  push:
    branches: [main, agent/zero-operation-relay]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_MODE: report-only

jobs:
  build:
    name: Build Android and Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: