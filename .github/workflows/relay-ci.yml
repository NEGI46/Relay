name: Relay CI

on:
  pull_request:
  push:
    branches: [main, agent/zero-operation-relay]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_MODE: report-only

jobs:
  build:
    name: Build Android and Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK and JVM artifacts
        run: ./gradlew :app:assembleDebug :pc-gateway:build :pc-gateway:installDist :broker:test --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-build-artifacts
          path: |
            app/build/outputs/apk/**/*.apk
            pc-gateway/build/libs/**
            pc-gateway/build/install/pc-gateway/**
          if-no-files-found: warn

  unit:
    name: Shared unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew :shared:jvmTest :relay-protocol:test :app:testDebugUnitTest --no-daemon
      - name: Verify test execution (0 tests = FAIL)
        if: always()
        shell: bash
        run: |
          total=0
          for xml in $(find . -path '*/test-results/testDebugUnitTest/*.xml' -o -path '*/test-results/test/*.xml' -o -path '*/test-results/jvmTest/*.xml'); do
            count=$(grep -c '<testcase' "$xml" 2>/dev/null || echo 0)
            total=$((total + count))
          done
          echo "Total test cases found in JUnit XML: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No test cases found in JUnit XML results. This indicates tests did not run."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-unit-test-results
          path: |
            **/build/test-results/
            **/build/reports/tests/
          if-no-files-found: warn

  mutation:
    name: Mutation testing gate (relay-protocol)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      # Fail-closed: pitest exits non-zero when the mutation score drops below
      # the threshold pinned in relay-protocol/build.gradle.kts.
      - run: ./gradlew :relay-protocol:pitest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-mutation-report
          path: relay-protocol/build/reports/pitest/
          if-no-files-found: warn

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  playwright:
    name: Staff console Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Install Playwright dependencies
        working-directory: staff-console-e2e
        run: npm ci
      - name: Install Chromium
        working-directory: staff-console-e2e
        run: npx playwright install chromium
      - name: Run Playwright tests
        working-directory: staff-console-e2e
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-playwright-report
          path: |
            staff-console-e2e/playwright-report/
            staff-console-e2e/test-results/
          if-no-files-found: warn

  ui:
    name: Compose UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - run: ./gradlew :composeApp:desktopTest --no-daemon

  accessibility-contract:
    name: Accessibility and UI safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify security and runtime implementation contracts
        shell: pwsh
        run: ./scripts/verify-implementation-contracts.ps1
      - shell: pwsh
        run: ./scripts/check-accessibility.ps1
      - shell: pwsh
        run: ./test-lab/run-host-checks.ps1

  readiness:
    name: Readiness status single source of truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned readiness tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Validate status.yml against schema and semantic rules
        run: python tools/readiness/readiness_tool.py validate
      - name: Fail on drift between status.yml and generated docs/README block
        run: python tools/readiness/readiness_tool.py check
      - name: Publish readiness job summary
        if: always()
        run: python tools/readiness/readiness_tool.py summary

  fuzz-regression:
    name: Decoder regression and JVM Jazzer targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./scripts/run-jazzer.ps1 -Mode $env:SECURITY_MODE -OutputPath artifacts/jazzer -RequirePython
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-fuzz-regression
          path: artifacts/jazzer/
          if-no-files-found: warn

  apk-scan:
    name: APK static scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        env:
          MOBSF_URL: ${{ secrets.MOBSF_URL }}
          MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
        run: ./scripts/run-mobsf.ps1 -ArtifactPath distribution -OutputPath artifacts/mobsf.json -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-apk-scan
          path: artifacts/
          if-no-files-found: warn

  deps-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pin the toolchain action and scanner source versions. The bootstrap refuses an
      # unverified Go proxy/checksum configuration and fails rather than emitting PASS.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install pinned dependency-security scanners
        shell: bash
        run: bash ./scripts/install-security-tools.sh "$RUNNER_TEMP/relay-security-tools"
      - shell: pwsh
        run: ./scripts/run-syft.ps1 -SourcePath . -OutputPath artifacts/syft-sbom.json -SpdxOutputPath artifacts/syft-sbom.spdx.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - shell: pwsh
        run: ./scripts/run-osv.ps1 -SourcePath . -OutputPath artifacts/osv.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - shell: pwsh
        run: ./scripts/run-grype.ps1 -InputPath artifacts/syft-sbom.json -OutputPath artifacts/grype.json -Mode $env:SECURITY_MODE
        continue-on-error: true
      - name: Require complete dependency-security evidence
        if: always()
        shell: pwsh
        run: ./scripts/verify-security-evidence.ps1 -EvidencePaths artifacts/syft-sbom.json,artifacts/osv.json,artifacts/grype.json -OutputPath artifacts/dependency-security-evidence.json -RequireComplete -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-dependency-scan
          path: artifacts/
          if-no-files-found: warn

  sign-verify:
    name: Distribution verification
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        run: ./scripts/verify-distribution-signatures.ps1 -PackageRoot distribution -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-signature-verification
          path: artifacts/signature-verification.json
          if-no-files-found: warn

  security-evidence:
    name: Security evidence summary
    runs-on: ubuntu-latest
    needs: [apk-scan, deps-scan, sign-verify]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: relay-*
          path: evidence
          merge-multiple: true
      - shell: pwsh
        # In report-only mode, unavailable external services remain explicitly BLOCKED in the
        # artifact. The evidence script enforces completeness automatically in block-high-critical.
        run: ./scripts/verify-security-evidence.ps1 -EvidencePaths evidence/mobsf.json,evidence/syft-sbom.json,evidence/osv.json,evidence/grype.json,evidence/signature-verification.json -OutputPath evidence/security-evidence-summary.json -Mode $env:SECURITY_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-security-evidence-summary
          path: evidence/security-evidence-summary.json
          if-no-files-found: warn

  gateway-recovery:
    name: Gateway recovery and transport fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run gateway recovery contract tests
        run: python -m unittest discover tests/gateway-recovery -p '*_smoke.py' -v
      - name: Run BPv7 export contract tests
        run: python -m unittest discover gateway-bp7-export -p 'test_*.py' -v
      - name: Run Meshtastic adapter contract tests
        env:
          PYTHONPATH: gateway-meshtastic-adapter
        run: python -m unittest discover gateway-meshtastic-adapter/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-gateway-recovery
          path: tests/gateway-recovery/
          if-no-files-found: warn

  hardware-independent-contracts:
    name: Hardware-independent contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Mobly host contract unittest discovery
        run: python -m unittest discover -s test-lab/mobly -p '*_test.py' -v
      - name: Run BLE simulator unittest harness
        run: python tools/ble-sim/run_tests.py
      - name: Run deterministic decoder regression tests
        run: python -m unittest discover -s test-lab/fuzz -p 'decoder*_test.py' -v
      - name: Run municipal-pilot security contract tests
        run: python -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Run TUF metadata chain contract tests
        run: python test-lab/tuf_metadata_test.py -v

  windows-validation:
    name: Windows PowerShell and PC Gateway validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Windows-specific guard: the PC Gateway launchers are executed by Windows PowerShell 5.1,
      # which parses BOM-less scripts using the system ANSI code page (CP932 on Japanese Windows).
      # Any non-ASCII byte would be misread and break the launcher, so the launchers must stay
      # ASCII-only and parse cleanly under both CP932 and UTF-8.
      - name: Windows PowerShell 5.1 syntax and encoding check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts\start-pc-gateway-development.ps1',
            'scripts\register-poc-gateway-autostart.ps1',
            'scripts\run-pc-gateway.ps1',
            'scripts\setup-pc-gateway.ps1',
            'scripts\register-pc-gateway-autostart.ps1',
            'scripts\configure-pc-gateway-firewall.ps1',
            'scripts\smoke-test-pc-gateway.ps1'
          )
          foreach ($s in $scripts) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "Windows PowerShell 5.1 parse failed: $s"
            }
            Write-Host "Windows PowerShell 5.1 parse OK: $s"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\launcher-encoding.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CP932/ASCII encoding regression test failed (Windows PowerShell 5.1)' }
      - name: PowerShell 7 syntax and encoding check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts\start-pc-gateway-development.ps1',
            'scripts\register-poc-gateway-autostart.ps1',
            'scripts\run-pc-gateway.ps1',
            'scripts\setup-pc-gateway.ps1',
            'scripts\register-pc-gateway-autostart.ps1',
            'scripts\configure-pc-gateway-firewall.ps1',
            'scripts\smoke-test-pc-gateway.ps1'
          )
          foreach ($s in $scripts) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell 7 parse failed: $s"
            }
            Write-Host "PowerShell 7 parse OK: $s"
          }
          ./scripts/tests/launcher-encoding.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CP932/ASCII encoding regression test failed (PowerShell 7)' }
      - name: Windows PowerShell launcher contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\run-pc-gateway-launcher.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'run-pc-gateway-launcher.tests.ps1 failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\register-poc-gateway-autostart.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'register-poc-gateway-autostart.tests.ps1 failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\pc-gateway-setup.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'pc-gateway-setup.tests.ps1 failed' }
      - name: PC Gateway tests, build and installDist
        shell: pwsh
        run: ./gradlew.bat :pc-gateway:test :pc-gateway:build :pc-gateway:installDist --no-daemon --console=plain
      - name: PC Gateway smoke test and /api/health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test-pc-gateway.ps1 -SkipBuild -HealthTimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) { throw 'PC Gateway smoke test failed' }
      - name: Upload Windows validation logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: relay-windows-validation
          path: |
            pc-gateway/build/reports/**
            pc-gateway/build/test-results/**
          if-no-files-found: warn
