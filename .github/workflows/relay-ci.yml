name: Relay CI

on:
  pull_request:
  push:
    branches: [agent/zero-operation-relay]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_MODE: report-only

jobs:
  build:
    name: Build Android and Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK and JVM artifacts
        run: ./gradlew :app:assembleDebug :pc-gateway:build --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-build-artifacts
          path: |
            app/build/outputs/apk/**/*.apk
            pc-gateway/build/libs/**
          if-no-files-found: warn

  unit:
    name: Shared unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew :shared:jvmTest :app:testDebugUnitTest --no-daemon

  ui:
    name: Compose UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew :composeApp:desktopTest --no-daemon

  accessibility-contract:
    name: Accessibility and UI safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify security and runtime implementation contracts
        shell: pwsh
        run: ./scripts/verify-implementation-contracts.ps1
      - shell: pwsh
        run: ./scripts/check-accessibility.ps1
      - shell: pwsh
        run: ./test-lab/run-host-checks.ps1

  fuzz-regression:
    name: Deterministic decoder regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - shell: pwsh
        run: ./scripts/run-jazzer.ps1 -Mode $env:SECURITY_MODE -OutputPath artifacts/jazzer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-fuzz-regression
          path: artifacts/jazzer/
          if-no-files-found: warn

  apk-scan:
    name: APK static scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        run: ./scripts/run-mobsf.ps1 -ArtifactPath distribution -OutputPath artifacts/mobsf.json -Mode $env:SECURITY_MODE -RequireTool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-apk-scan
          path: artifacts/
          if-no-files-found: warn

  deps-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/run-syft.ps1 -SourcePath . -OutputPath artifacts/syft-sbom.json -SpdxOutputPath artifacts/syft-sbom.spdx.json -RequireTool
      - shell: pwsh
        run: ./scripts/run-osv.ps1 -SourcePath . -OutputPath artifacts/osv.json -Mode $env:SECURITY_MODE -RequireTool
      - shell: pwsh
        run: ./scripts/run-grype.ps1 -InputPath artifacts/syft-sbom.json -OutputPath artifacts/grype.json -Mode $env:SECURITY_MODE -RequireTool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-dependency-scan
          path: artifacts/
          if-no-files-found: warn

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/run-syft.ps1 -SourcePath . -OutputPath artifacts/syft-sbom.json -SpdxOutputPath artifacts/syft-sbom.spdx.json -RequireTool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-sbom
          path: artifacts/
          if-no-files-found: warn

  sign-verify:
    name: Distribution verification
    runs-on: ubuntu-latest
    needs: [build, sbom]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relay-build-artifacts
          path: distribution
      - shell: pwsh
        run: ./scripts/verify-distribution-signatures.ps1 -PackageRoot distribution -Mode $env:SECURITY_MODE

  gateway-recovery:
    name: Gateway recovery and transport fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run gateway recovery contract tests
        run: python -m unittest discover tests/gateway-recovery -p '*_smoke.py' -v
      - name: Run BPv7 export contract tests
        run: python -m unittest discover gateway-bp7-export -p 'test_*.py' -v
      - name: Run Meshtastic adapter contract tests
        env:
          PYTHONPATH: gateway-meshtastic-adapter
        run: python -m unittest discover gateway-meshtastic-adapter/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-gateway-recovery
          path: tests/gateway-recovery/
          if-no-files-found: warn

  hardware-independent-contracts:
    name: Hardware-independent contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Mobly host contract unittest discovery
        run: python -m unittest discover -s test-lab/mobly -p '*_test.py' -v
      - name: Run BLE simulator unittest harness
        run: python tools/ble-sim/run_tests.py
      - name: Run deterministic decoder regression tests
        run: python -m unittest discover -s test-lab/fuzz -p 'decoder*_test.py' -v
      - name: Run TUF metadata chain contract tests
        run: python test-lab/tuf_metadata_test.py -v
