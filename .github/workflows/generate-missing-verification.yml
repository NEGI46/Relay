name: Generate missing Gradle verification hashes

on:
  pull_request:
    branches:
      - agent/zero-operation-relay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate exact missing metadata hashes
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p .github/tmp
          trap 'rm -f .github/tmp/verification.init.gradle' EXIT
          cat > .github/tmp/verification.init.gradle <<'EOF'
          allprojects {
            tasks.register("resolveExactVerificationMetadata") {
              doLast {
                configurations.detachedConfiguration(
                  dependencies.create("com.google.guava:guava-parent:33.4.0-jre@pom")
                ).resolve()
                configurations.detachedConfiguration(
                  dependencies.create("org.junit:junit-bom:5.11.0-M2@module")
                ).resolve()
              }
            }
          }
          EOF
          ./gradlew --write-verification-metadata sha256 \
            --init-script .github/tmp/verification.init.gradle \
            resolveExactVerificationMetadata --no-daemon
      - name: Commit generated verification metadata
        shell: bash
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No verification metadata change generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: verify Gradle metadata variants"
          git push
