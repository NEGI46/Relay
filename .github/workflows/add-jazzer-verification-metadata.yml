name: Add Jazzer verification metadata

on:
  push:
    branches:
      - agent/clean-verification-metadata

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate JVM Jazzer verification metadata
        run: |
          chmod +x gradlew
          ./gradlew --refresh-dependencies --write-verification-metadata sha256 :fuzz-jvm:test --no-daemon
      - name: Commit generated verification metadata
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: verify Jazzer dependency metadata"
          git push
