name: Apple dependency verification bootstrap

on:
  pull_request:
    branches: [agent/zero-operation-relay]
    paths:
      - gradle/libs.versions.toml
      - gradle/verification-metadata.xml
      - .github/workflows/apple-verification-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Apple verification metadata
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve Apple dependencies and write checksums
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            --no-daemon
      - name: Upload generated verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
