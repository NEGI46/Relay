name: Publish Relay release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      target_ref:
        description: Commit, branch, or tag to package
        required: true
        default: agent/zero-operation-relay
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Relay-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/
          if-no-files-found: error

  windows-installer:
    name: Build Windows PC Gateway installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install WiX 3 packaging tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix314-binaries.zip
          Expand-Archive -LiteralPath wix314-binaries.zip -DestinationPath tools/wix314 -Force
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-pc-gateway-exe.ps1
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/relay-pc-gateway.exe release/Relay-PC-Gateway-setup.exe -Force
          Copy-Item artifacts/relay-pc-gateway.exe.sha256 release/Relay-PC-Gateway-setup.exe.sha256 -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows-installer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if gh release view "$RELEASE_TAG"; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$TARGET_REF" --title "Relay $RELEASE_TAG" --generate-notes
          fi
