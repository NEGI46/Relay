name: Publish Relay formal release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      target_ref:
        description: Immutable commit SHA, branch, or tag to package
        required: true
        default: agent/zero-operation-relay
        type: string

# This workflow intentionally fails before publication unless organization-owned signing and
# verification material is available. It must never turn a debug, unsigned, or locally signed
# build into a GitHub Release.
# Only the publish job needs contents: write; every other job runs read-only.
permissions:
  contents: read

env:
  SECURITY_MODE: block-high-critical

jobs:
  resolve-source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - id: commit
        name: Resolve checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unable to resolve immutable release commit.' >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android release APK
    runs-on: ubuntu-latest
    needs: resolve-source
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Require organization Android signing material
        env:
          RELAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.RELAY_ANDROID_KEYSTORE_BASE64 }}
          RELAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELAY_ANDROID_KEYSTORE_PASSWORD }}
          RELAY_ANDROID_KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
          RELAY_ANDROID_KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in RELAY_ANDROID_KEYSTORE_BASE64 RELAY_ANDROID_KEYSTORE_PASSWORD RELAY_ANDROID_KEY_ALIAS RELAY_ANDROID_KEY_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "Formal Android release BLOCKED: required organization signing secret is unavailable." >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/relay-release"
          printf '%s' "$RELAY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/relay-release/android-release.jks"
          chmod 600 "$RUNNER_TEMP/relay-release/android-release.jks"
      - name: Build signed release APK
        env:
          RELAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELAY_ANDROID_KEYSTORE_PASSWORD }}
          RELAY_ANDROID_KEY_ALIAS: ${{ secrets.RELAY_ANDROID_KEY_ALIAS }}
          RELAY_ANDROID_KEY_PASSWORD: ${{ secrets.RELAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Prelay.require.release.signing=true \
            -Prelay.release.store.file="$RUNNER_TEMP/relay-release/android-release.jks" \
            -Prelay.release.store.password="$RELAY_ANDROID_KEYSTORE_PASSWORD" \
            -Prelay.release.key.alias="$RELAY_ANDROID_KEY_ALIAS" \
            -Prelay.release.key.password="$RELAY_ANDROID_KEY_PASSWORD"
      - name: Verify APK signature and prepare asset
        run: |
          set -euo pipefail
          command -v apksigner >/dev/null || { echo 'Formal Android release BLOCKED: apksigner is unavailable.' >&2; exit 1; }
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk" || { echo 'assembleRelease did not produce app-release.apk.' >&2; exit 1; }
          mkdir -p release
          apksigner verify --verbose --print-certs "$apk" > release/android-signature-verification.txt
          cp "$apk" release/Relay-Android-release.apk
          sha256sum release/Relay-Android-release.apk > release/Relay-Android-release.apk.sha256
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unable to resolve immutable build commit.' >&2; exit 1; }
          printf '{"artifact":"Relay-Android-release.apk","sourceCommit":"%s","buildType":"release","formalSigning":"organization-secret"}\n' "$source_commit" > release/android-build-info.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-release-android
          path: release/
          if-no-files-found: error

  windows-installer:
    name: Authenticode-signed Windows installer
    runs-on: windows-latest
    needs: resolve-source
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Require pinned packaging tools and organization Windows certificate
        shell: pwsh
        env:
          RELAY_WINDOWS_AUTHENTICODE_PFX_BASE64: ${{ secrets.RELAY_WINDOWS_AUTHENTICODE_PFX_BASE64 }}
          RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
          RELAY_WINDOWS_TIMESTAMP_URL: ${{ secrets.RELAY_WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'RELAY_WINDOWS_AUTHENTICODE_PFX_BASE64','RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD','RELAY_WINDOWS_TIMESTAMP_URL') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw 'Formal Windows release BLOCKED: required organization certificate/timestamp secret is unavailable.'
            }
          }
          foreach ($tool in 'candle.exe','light.exe','signtool.exe') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Formal Windows release BLOCKED: required pre-provisioned tool is unavailable: $tool"
            }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'relay-authenticode.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:RELAY_WINDOWS_AUTHENTICODE_PFX_BASE64))
          $env:RELAY_WINDOWS_PFX_PATH = $pfxPath
      - name: Build and sign Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
          RELAY_WINDOWS_TIMESTAMP_URL: ${{ secrets.RELAY_WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format: $env:RELEASE_TAG"
          }
          ./scripts/build-pc-gateway-exe.ps1 -AppVersion $Matches.version
          $installer = 'artifacts/relay-pc-gateway.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Windows installer was not produced.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'relay-authenticode.pfx'
          & signtool.exe sign /fd SHA256 /f $pfxPath /p $env:RELAY_WINDOWS_AUTHENTICODE_PFX_PASSWORD /tr $env:RELAY_WINDOWS_TIMESTAMP_URL /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          & signtool.exe verify /pa /all /v $installer *> 'artifacts/windows-authenticode-verification.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }
      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/relay-pc-gateway.exe release/Relay-PC-Gateway-setup.exe -Force
          # Authenticode signing changes the installer bytes, so never reuse the pre-signing
          # package hash created by build-pc-gateway-exe.ps1.
          (Get-FileHash -LiteralPath release/Relay-PC-Gateway-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath release/Relay-PC-Gateway-setup.exe.sha256 -Encoding ascii
          Copy-Item artifacts/windows-authenticode-verification.txt release/windows-authenticode-verification.txt -Force
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Unable to resolve immutable build commit.' }
          "{`"artifact`":`"Relay-PC-Gateway-setup.exe`",`"sourceCommit`":`"$sourceCommit`",`"formalSigning`":`"authenticode-organization-certificate`"}" | Set-Content -LiteralPath release/windows-build-info.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-release-windows
          path: release/
          if-no-files-found: error

  security-attestation:
    name: Required SBOM, vulnerability, and signature evidence
    runs-on: ubuntu-latest
    needs: [resolve-source, android, windows-installer]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Formal release evidence must be generated with the same pinned, checksum-verified
      # scanner toolchain as Relay CI. Missing scanners remain a hard failure below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install pinned dependency-security scanners
        shell: bash
        run: bash ./scripts/install-security-tools.sh "$RUNNER_TEMP/relay-security-tools"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: formal-release-*
          path: release
          merge-multiple: true
      - name: Require SBOM and dependency-vulnerability evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/run-syft.ps1 -SourcePath release -OutputPath release/release-sbom.cdx.json -SpdxOutputPath release/release-sbom.spdx.json -Mode block-high-critical -RequireTool
          ./scripts/run-osv.ps1 -SourcePath . -OutputPath release/osv-vulnerability-report.json -Mode block-high-critical -RequireTool
          ./scripts/run-grype.ps1 -InputPath release/release-sbom.cdx.json -OutputPath release/grype-vulnerability-report.json -Mode block-high-critical -RequireTool
          ./scripts/verify-security-evidence.ps1 -EvidencePaths release/release-sbom.cdx.json,release/osv-vulnerability-report.json,release/grype-vulnerability-report.json -OutputPath release/dependency-security-evidence.json -RequireComplete -Mode block-high-critical
      - name: Add source commit manifest and checksums before signing
        shell: bash
        run: |
          set -euo pipefail
          test -f release/Relay-Android-release.apk
          test -f release/Relay-PC-Gateway-setup.exe
          test -f release/android-signature-verification.txt
          test -f release/windows-authenticode-verification.txt
          test -f release/release-sbom.spdx.json
          cp LICENSE release/LICENSE
          cp docs/runbooks/VERIFY_FORMAL_RELEASE.md release/RELEASE_ARTIFACT_VERIFICATION.md
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unable to resolve immutable build commit.' >&2; exit 1; }
          printf '{"sourceCommit":"%s","workflow":"%s","formalRelease":true}\n' "$source_commit" "$GITHUB_WORKFLOW" > release/build-source.json
          (
            cd release
            sha256sum Relay-Android-release.apk Relay-PC-Gateway-setup.exe LICENSE android-build-info.json windows-build-info.json build-source.json RELEASE_ARTIFACT_VERIFICATION.md > SHA256SUMS
          )
      - name: Require and apply release artifact signatures
        shell: pwsh
        env:
          RELAY_COSIGN_PRIVATE_KEY: ${{ secrets.RELAY_COSIGN_PRIVATE_KEY }}
          RELAY_COSIGN_PUBLIC_KEY: ${{ secrets.RELAY_COSIGN_PUBLIC_KEY }}
          RELAY_TUF_PRIVATE_KEY: ${{ secrets.RELAY_TUF_PRIVATE_KEY }}
          RELAY_TUF_TRUSTED_ROOT: ${{ secrets.RELAY_TUF_TRUSTED_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'RELAY_COSIGN_PRIVATE_KEY','RELAY_COSIGN_PUBLIC_KEY','RELAY_TUF_PRIVATE_KEY','RELAY_TUF_TRUSTED_ROOT') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw 'Formal release BLOCKED: required organization artifact-signing or trusted-root material is unavailable.'
            }
          }
          if (-not (Get-Command cosign -ErrorAction SilentlyContinue)) { throw 'Formal release BLOCKED: cosign is unavailable.' }
          if (-not (Get-Command syft -ErrorAction SilentlyContinue)) { throw 'Formal release BLOCKED: syft is unavailable.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'relay-cosign.key'
          $publicKeyPath = Join-Path $env:RUNNER_TEMP 'relay-cosign.pub'
          $tufKeyPath = Join-Path $env:RUNNER_TEMP 'relay-tuf-private.xml'
          $trustedRootPath = Join-Path $env:RUNNER_TEMP 'relay-tuf-trusted-root.json'
          Set-Content -LiteralPath $keyPath -Value $env:RELAY_COSIGN_PRIVATE_KEY -NoNewline -Encoding utf8
          Set-Content -LiteralPath $publicKeyPath -Value $env:RELAY_COSIGN_PUBLIC_KEY -NoNewline -Encoding utf8
          Set-Content -LiteralPath $tufKeyPath -Value $env:RELAY_TUF_PRIVATE_KEY -NoNewline -Encoding utf8
          Set-Content -LiteralPath $trustedRootPath -Value $env:RELAY_TUF_TRUSTED_ROOT -NoNewline -Encoding utf8
          ./scripts/sign-artifacts.ps1 -PackageRoot release -MetadataRoot release/metadata/tuf -CosignKey $keyPath -TufPrivateKey $tufKeyPath
          ./scripts/verify-distribution-signatures.ps1 -PackageRoot release -PublicKey $publicKeyPath -Offline -RequireBundles -RequireVerification -OutputPath release/signature-verification.json
          python ./scripts/verify-tuf-metadata-chain.py release/metadata/tuf
          foreach ($artifact in 'Relay-Android-release.apk','Relay-PC-Gateway-setup.exe') {
            ./scripts/verify-tuf-metadata.ps1 -MetadataPath release/metadata/tuf/targets.json -ArtifactPath (Join-Path release $artifact) -TargetName $artifact -TrustedRootPath $trustedRootPath
          }
      - name: Finalize formal release package
        shell: bash
        run: |
          set -euo pipefail
          test -f release/Relay-Android-release.apk
          test -f release/Relay-PC-Gateway-setup.exe
          test -f release/android-signature-verification.txt
          test -f release/windows-authenticode-verification.txt
          test -f release/release-sbom.spdx.json
          test -f release/LICENSE
          test -f release/signature-verification.json
          test -f release/RELEASE_ARTIFACT_VERIFICATION.md
          tar -C release/metadata -czf release/Relay-TUF-metadata.tar.gz tuf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-release-complete
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-source, security-attestation]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formal-release-complete
          path: release
      - name: Refuse incomplete or debug publication
        run: |
          set -euo pipefail
          test -f release/Relay-Android-release.apk
          test -f release/Relay-PC-Gateway-setup.exe
          test -f release/SHA256SUMS
          test -f release/LICENSE
          test -f release/release-sbom.spdx.json
          test -f release/signature-verification.json
          test -f release/Relay-TUF-metadata.tar.gz
          if find release -type f -iname '*debug*' | grep -q .; then
            echo 'Formal release BLOCKED: debug-named artifact/evidence found.' >&2
            exit 1
          fi
      # Fail-closed: if provenance attestation cannot be produced, the release is not published.
      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/Relay-Android-release.apk
            release/Relay-PC-Gateway-setup.exe
            release/SHA256SUMS
      - name: Create or update formal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$TARGET_COMMIT" --title "Relay $RELEASE_TAG" --generate-notes
          fi