name: Security baseline

on:
  pull_request:
  push:
    branches: [main, agent/zero-operation-relay]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.28.0
  DETEKT_VERSION: 1.23.8
  DETEKT_SHA256: 2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gitleaks (checksum verified, fail-closed)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan full git history with Relay-specific rules
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned actionlint (checksum verified, fail-closed)
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
      - name: Run actionlint on all workflows
        run: ./actionlint -color
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned zizmor
        run: python -m pip install "zizmor==${ZIZMOR_VERSION}"
      - name: Run zizmor static analysis on workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona regular .github/workflows

  action-pinning:
    name: Verify all actions are SHA-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail on any non-SHA action reference
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref=$(echo "$line" | sed -E 's/.*uses:[[:space:]]*//; s/[[:space:]]*#.*$//; s/["'\'']//g')
            # Local composite actions and docker refs are out of scope.
            case "$ref" in
              ./*|docker://*) continue ;;
            esac
            version="${ref##*@}"
            if ! echo "$version" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Not SHA-pinned: $ref"
              bad=1
            fi
          done < <(grep -rhE '^\s*(-\s+)?uses:' .github/workflows/)
          if [ "$bad" -ne 0 ]; then
            echo "::error::All workflow actions must be pinned to a full commit SHA."
            exit 1
          fi
          echo "All action references are SHA-pinned."

  detekt:
    name: Kotlin static analysis (detekt + Relay rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned detekt CLI (checksum verified, fail-closed)
        run: |
          curl -fsSL -o detekt-cli.jar "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          echo "${DETEKT_SHA256}  detekt-cli.jar" | sha256sum -c -
      - name: Run detekt with Relay-specific rules against baseline
        run: |
          java -jar detekt-cli.jar \
            --input app/src,pc-gateway/src,broker/src,relay-protocol/src,shared/src,composeApp/src,fuzz-jvm/src \
            --config config/detekt/detekt.yml \
            --build-upon-default-config \
            --baseline config/detekt/baseline.xml
