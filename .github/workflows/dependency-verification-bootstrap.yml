name: Dependency verification bootstrap

on:
  pull_request:
    branches: [agent/zero-operation-relay]
    paths:
      - gradle/libs.versions.toml
      - gradle/verification-metadata.xml
      - .github/workflows/dependency-verification-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate verification metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve updated dependencies and write checksums
        id: bootstrap
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 \
            :app:assembleDebug \
            :pc-gateway:build \
            :pc-gateway:installDist \
            :broker:test \
            :relay-protocol:test \
            :shared:jvmTest \
            :composeApp:desktopTest \
            :fuzz-jvm:test \
            --no-daemon
      - name: Upload generated verification metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
      - name: Report bootstrap result
        if: steps.bootstrap.outcome != 'success'
        run: echo "::warning::Dependencies resolved and metadata uploaded, but a build task still failed; inspect the bootstrap log after applying metadata."
