name: Publish Relay development preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Development preview tag (for example, development-preview-20260722)
        required: true
        type: string
      target_ref:
        description: Immutable commit SHA, branch, or tag to package
        required: true
        default: agent/zero-operation-relay
        type: string

# This workflow is intentionally separate from "Publish Relay formal release". It publishes a
# debug/localDev Android APK and an unsigned Windows installer strictly for personal development.
# It never uses, accepts, or claims organization signing, vulnerability attestation, or a formal
# release trust root.
# Only the publish job needs contents: write; every other job runs read-only.
permissions:
  contents: read

concurrency:
  group: relay-development-preview-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve preview source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unable to resolve preview source commit.' >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  android-localdev:
    name: Build Android localDev preview
    runs-on: ubuntu-latest
    needs: resolve-source
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug-compatible localDev APK
        shell: bash
        env:
          RELAY_BROKER_ENDPOINT: ${{ vars.RELAY_BROKER_ENDPOINT }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Bake the operator's stable ngrok broker URL so mobile-data delivery works with no
          # per-run rebuild. Unset variable keeps the endpoint empty (mobile delivery disabled).
          BROKER_ARG=()
          if [ -n "${RELAY_BROKER_ENDPOINT:-}" ]; then
            BROKER_ARG=("-Prelay.broker.endpoint=${RELAY_BROKER_ENDPOINT}")
          fi
          ./gradlew :app:assembleLocalDev --no-daemon "${BROKER_ARG[@]}"
          mkdir -p release
          cp app/build/outputs/apk/localDev/app-localDev.apk release/Relay-Android-development-preview-debug.apk
          sha256sum release/Relay-Android-development-preview-debug.apk > release/Relay-Android-development-preview-debug.apk.sha256
          cat > release/ANDROID_DEVELOPMENT_PREVIEW_NOTICE.txt <<'EOF'
          DEVELOPMENT PREVIEW ONLY

          This artifact is a debug/localDev APK. It is not a formal Relay release, is not
          organization-signed, and must not be used for pilot or emergency operations.
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-preview-android
          path: release/
          if-no-files-found: error

  windows-unsigned:
    name: Build unsigned Windows development preview
    runs-on: windows-latest
    needs: resolve-source
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build unsigned installer and development launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-pc-gateway-exe.ps1 -AppVersion "0.0.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/relay-pc-gateway.exe release/Relay-PC-Gateway-development-preview-unsigned.exe -Force
          (Get-FileHash -LiteralPath release/Relay-PC-Gateway-development-preview-unsigned.exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath release/Relay-PC-Gateway-development-preview-unsigned.exe.sha256 -Encoding ascii
          Copy-Item artifacts/Relay-PC-Gateway-development.ps1 release/Relay-PC-Gateway-development.ps1 -Force
          Copy-Item artifacts/Start-Relay-PC-Gateway-Development.cmd release/Start-Relay-PC-Gateway-Development.cmd -Force
          Copy-Item scripts/register-pc-gateway-autostart.ps1 release/Register-Relay-PC-Gateway-Autostart-development.ps1 -Force
          Copy-Item artifacts/Start-Relay-Broker-Tunnel-Development.ps1 release/Start-Relay-Broker-Tunnel-Development.ps1 -Force
          Copy-Item artifacts/Start-Relay-Broker-Tunnel-Development.cmd release/Start-Relay-Broker-Tunnel-Development.cmd -Force
          Copy-Item artifacts/relay-broker-bundle.zip release/relay-broker-bundle.zip -Force
          (Get-FileHash -LiteralPath release/relay-broker-bundle.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath release/relay-broker-bundle.zip.sha256 -Encoding ascii
          @'
          DEVELOPMENT PREVIEW ONLY

          This Windows installer is unsigned. It is not a formal Relay release and must not be
          used for pilot or emergency operations. Use Start-Relay-PC-Gateway-Development.cmd after
          installation; it prompts for a local username and password and keeps data under LocalAppData.

          To auto-start the gateway after logon or reboot, run
          Register-Relay-PC-Gateway-Autostart-development.ps1 from an elevated PowerShell. It only
          registers a Task Scheduler task and never stores broker credentials or secrets.

          To let a phone on mobile data (no shared Wi-Fi) reach this PC, run
          Start-Relay-Broker-Tunnel-Development.cmd. It needs Docker Desktop and relay-broker-bundle.zip
          (ship them together). It runs the Broker from the public eclipse-temurin image, opens an
          ngrok tunnel bound to your reserved free static domain, and wires the installed gateway to
          it. No repository clone is needed. Because the ngrok domain is stable across restarts, the
          preview APK bakes it once, so the phone never needs another rebuild. A free ngrok tunnel
          has no SLA; development testing only.
          '@ | Set-Content -LiteralPath release/WINDOWS_DEVELOPMENT_PREVIEW_NOTICE.txt -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-preview-windows
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    runs-on: ubuntu-latest
    needs: [resolve-source, android-localdev, windows-unsigned]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: development-preview-*
          path: release
          merge-multiple: true
      - name: Refuse accidental formal artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f release/Relay-Android-development-preview-debug.apk
          test -f release/Relay-PC-Gateway-development-preview-unsigned.exe
          test -f release/Register-Relay-PC-Gateway-Autostart-development.ps1
          test -f release/Start-Relay-Broker-Tunnel-Development.cmd
          test -f release/Start-Relay-Broker-Tunnel-Development.ps1
          test -f release/relay-broker-bundle.zip
          test -f release/ANDROID_DEVELOPMENT_PREVIEW_NOTICE.txt
          test -f release/WINDOWS_DEVELOPMENT_PREVIEW_NOTICE.txt
          if find release -type f \( -name 'Relay-Android-release.apk' -o -name 'Relay-PC-Gateway-setup.exe' \) | grep -q .; then
            echo 'Development preview must not publish formal-release-named artifacts.' >&2
            exit 1
          fi
      - name: Create or update development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          notes='Development preview only: debug/localDev Android APK and unsigned Windows installer. Not for pilot or emergency operation.'
          if prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null)"; then
            if [ "$prerelease" != 'true' ]; then
              echo 'Refusing to upload a development preview to a non-prerelease tag.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$TARGET_COMMIT" --title "Relay development preview $RELEASE_TAG" --prerelease --notes "$notes"
          fi
