name: Security alert count audit

on:
  push:
    branches: [fix/dependency-security-quality]
    paths:
      - .github/workflows/security-alert-count-audit.yml

permissions:
  contents: read
  security-events: read

jobs:
  audit:
    name: Count open security alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count open alerts without retaining details
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count_alerts() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/$1/alerts?state=open&per_page=100" \
              | jq -s 'add | length'
          }
          code_scanning="$(count_alerts code-scanning)"
          dependabot="$(count_alerts dependabot)"
          secret_scanning="$(count_alerts secret-scanning)"
          total="$((code_scanning + dependabot + secret_scanning))"
          printf 'code_scanning=%s\ndependabot=%s\nsecret_scanning=%s\ntotal=%s\n' \
            "${code_scanning}" "${dependabot}" "${secret_scanning}" "${total}"
          test "${total}" -eq 0
