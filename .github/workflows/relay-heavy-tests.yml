name: Relay Heavy Tests (Scheduled)

# Runs heavier tests that are too slow for every PR:
# - Packaged black-box E2E (Broker + Gateway as separate processes)
# - Build reproducibility verification
# These complement the per-PR unit/lint/playwright jobs.

on:
  pull_request:
    paths:
      - '.github/workflows/relay-heavy-tests.yml'
  schedule:
    - cron: '30 3 * * 1,4'  # Monday and Thursday at 03:30 UTC
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run packaged E2E test'
        type: boolean
        default: true
      run_reproducibility:
        description: 'Run build reproducibility check'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  packaged-e2e:
    name: Packaged Broker-Gateway E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.run_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build Broker and Gateway distributions
        run: ./gradlew :broker:installDist :pc-gateway:installDist --no-daemon
      - name: Start Broker
        run: |
          export RELAY_BROKER_PROFILE=DEVELOPMENT
          export RELAY_BROKER_HOST=127.0.0.1
          export RELAY_BROKER_PORT=19876
          export RELAY_BROKER_DB_PATH="$RUNNER_TEMP/broker.db"
          broker/build/install/broker/bin/broker &
          BROKER_PID=$!
          echo "BROKER_PID=$BROKER_PID" >> "$GITHUB_ENV"
          # Wait for health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19876/v1/health > /dev/null 2>&1; then
              echo "Broker healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:19876/v1/health || { echo "::error::Broker failed to start"; exit 1; }
      - name: Start Gateway
        run: |
          export RELAY_PROFILE=development
          export RELAY_GATEWAY_HOST=127.0.0.1
          export RELAY_GATEWAY_PORT=19877
          export RELAY_GATEWAY_DB="$RUNNER_TEMP/gateway.db"
          export RELAY_GATEWAY_ID=ci-test-gateway
          export RELAY_SHELTER_ID=ci-test-shelter
          export RELAY_RESCUE_KEY_FILE="$RUNNER_TEMP/rescue-keys.json"
          export RELAY_OFFLINE_MAP_DIR="$RUNNER_TEMP/maps"
          export RELAY_GATEWAY_LAN_MODE=DISABLED
          mkdir -p "$RUNNER_TEMP/maps"
          pc-gateway/build/install/pc-gateway/bin/pc-gateway &
          GATEWAY_PID=$!
          echo "GATEWAY_PID=$GATEWAY_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19877/api/health > /dev/null 2>&1; then
              echo "Gateway healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:19877/api/health || { echo "::error::Gateway failed to start"; exit 1; }
      - name: Run E2E flow tests
        run: |
          echo "=== Manifest fetch ==="
          MANIFEST=$(curl -sf http://127.0.0.1:19877/api/public/rescue/manifest)
          echo "$MANIFEST" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['recipientPublicKey']['encodedBase64'] and d['shelterId'] == 'ci-test-shelter', 'Invalid public manifest'" \
            || { echo "::error::Manifest lacks public key"; exit 1; }
          echo "Manifest OK"

          echo "=== Malformed envelope rejection ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:19876/v1/rescue/upload -H 'Content-Type: application/json' -d '{}')
          if [[ "$HTTP_CODE" != "400" ]]; then
            echo "::error::Expected malformed upload to return 400, got $HTTP_CODE"
            exit 1
          fi

          echo "=== Final health checks ==="
          curl -sf http://127.0.0.1:19876/v1/health || { echo "::error::Broker unhealthy after test"; exit 1; }
          curl -sf http://127.0.0.1:19877/api/health || { echo "::error::Gateway unhealthy after test"; exit 1; }
          echo "=== Packaged API smoke PASS (health, manifest, invalid input) ==="
      - name: Cleanup processes
        if: always()
        run: |
          if [ -n "$BROKER_PID" ]; then kill "$BROKER_PID" 2>/dev/null || true; fi
          if [ -n "$GATEWAY_PID" ]; then kill "$GATEWAY_PID" 2>/dev/null || true; fi

  build-reproducibility:
    name: APK build reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'schedule' || inputs.run_reproducibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build APK twice and compare
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          # First build
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p /tmp/build1
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/build1/
          SHA1=$(sha256sum /tmp/build1/app-debug.apk | cut -d' ' -f1)
          echo "Build 1 SHA-256: $SHA1"

          # Clean and rebuild
          rm -rf app/build/outputs/apk/debug/
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p /tmp/build2
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/build2/
          SHA2=$(sha256sum /tmp/build2/app-debug.apk | cut -d' ' -f1)
          echo "Build 2 SHA-256: $SHA2"

          if [ "$SHA1" = "$SHA2" ]; then
            echo "REPRODUCIBLE_BUILD_PASS"
          else
            echo "::warning::Builds differ. Comparing ZIP entries..."
            # Compare entry-by-entry
            python3 -c "
          import zipfile, hashlib, sys
          def entries(path):
              d = {}
              with zipfile.ZipFile(path) as z:
                  for info in z.infolist():
                      with z.open(info) as f:
                          d[info.filename] = hashlib.sha256(f.read()).hexdigest()
              return d
          e1 = entries('/tmp/build1/app-debug.apk')
          e2 = entries('/tmp/build2/app-debug.apk')
          diffs = [(k,e1.get(k),e2.get(k)) for k in sorted(set(list(e1)+list(e2))) if e1.get(k)!=e2.get(k)]
          if not diffs:
              print('REPRODUCIBLE_CONTENT_PASS_METADATA_DIFF')
          else:
              meta_only = all('META-INF' in d[0] for d in diffs)
              for name,h1,h2 in diffs:
                  print(f'  DIFF: {name}')
              if meta_only:
                  print('REPRODUCIBLE_CONTENT_PASS_METADATA_DIFF')
              else:
                  print('REPRODUCIBLE_BUILD_NOT_ACHIEVED')
                  sys.exit(1)
          "
          fi
