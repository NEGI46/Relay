name: Regenerate Gradle verification metadata

on:
  push:
    branches:
      - agent/clean-verification-metadata

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve current Linux dependency graphs
        run: |
          chmod +x gradlew
          mv gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata.previous.xml"
          ./gradlew --write-verification-metadata sha256             help             :app:lintDebug             :app:testDebugUnitTest             :shared:jvmTest             :relay-protocol:test             :broker:test             :broker:installDist             :pc-gateway:test             :pc-gateway:installDist             :composeApp:desktopTest             :fuzz-jvm:test             --no-daemon
      - name: Commit regenerated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: regenerate verification metadata"
          git push
