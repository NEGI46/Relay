<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Relay system overview</title>
  <desc id="desc">Bilingual architecture diagram showing the ordinary report lane, encrypted rescue lane, PC Gateway, recovery feed, and isolated edge adapters.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.55" stop-color="#0D2438"/>
      <stop offset="1" stop-color="#0A3940"/>
    </linearGradient>
    <linearGradient id="report" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rescue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#67E8F9"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FDBA74"/>
    </marker>
    <style>
      .title { font: 800 42px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 4px; }
      .subtitle { font: 600 18px Inter, Segoe UI, Arial, sans-serif; fill: #A5F3FC; letter-spacing: 1.5px; }
      .lane { font: 800 21px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .boxTitle { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .boxText { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #CBD5E1; }
      .jp { font-family: Noto Sans JP, Yu Gothic, Meiryo, sans-serif; }
      .small { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #94A3B8; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="190" fill="#22D3EE" opacity="0.05"/>
  <circle cx="100" cy="720" r="220" fill="#FB7185" opacity="0.04"/>

  <text x="60" y="72" class="title">RELAY SYSTEM MAP</text>
  <text x="62" y="106" class="subtitle">LOCAL-FIRST • STORE • CARRY • FORWARD</text>
  <text x="62" y="135" class="subtitle jp">ローカル優先で、情報を保存・運搬・再転送する</text>

  <rect x="45" y="166" width="1110" height="240" rx="24" fill="#071D31" stroke="#38BDF8" stroke-opacity="0.45"/>
  <rect x="45" y="430" width="1110" height="255" rx="24" fill="#211A26" stroke="#FB7185" stroke-opacity="0.48"/>

  <text x="70" y="203" class="lane">① ORDINARY REPORT LANE / 通常レポート経路</text>
  <text x="70" y="467" class="lane">② ENCRYPTED RESCUE LANE / 暗号化救助要請経路</text>

  <!-- Report lane boxes -->
  <g>
    <rect x="72" y="228" width="205" height="128" rx="18" fill="#0B2942" stroke="#38BDF8"/>
    <text x="92" y="260" class="boxTitle">📱 Android user</text>
    <text x="92" y="285" class="boxText jp">安否・避難・物資を作成</text>
    <text x="92" y="307" class="boxText">ECDSA report signature</text>
    <text x="92" y="329" class="boxText">Room + SQLCipher</text>

    <rect x="342" y="228" width="205" height="128" rx="18" fill="#0B2942" stroke="#38BDF8"/>
    <text x="362" y="260" class="boxTitle">📲 Nearby peer</text>
    <text x="362" y="285" class="boxText jp">差分同期・重複排除</text>
    <text x="362" y="307" class="boxText">TTL • hop • ACK</text>
    <text x="362" y="329" class="boxText jp">保存後に再び運ぶ</text>

    <rect x="612" y="228" width="215" height="128" rx="18" fill="#0B2942" stroke="#38BDF8"/>
    <text x="632" y="260" class="boxTitle">🚶 Bridge / courier</text>
    <text x="632" y="285" class="boxText jp">端末の移動で次の接点へ</text>
    <text x="632" y="307" class="boxText">UDP discovery on LAN</text>
    <text x="632" y="329" class="boxText">Public or paired upload</text>

    <rect x="892" y="215" width="225" height="154" rx="18" fill="#0B2942" stroke="#34D399"/>
    <text x="912" y="248" class="boxTitle">🖥 PC Gateway</text>
    <text x="912" y="273" class="boxText">Ktor • SQLite • Console</text>
    <text x="912" y="295" class="boxText jp">経路認証と内容検証を分離</text>
    <text x="912" y="317" class="boxText">Gateway receipt ≠ final delivery</text>
    <text x="912" y="339" class="boxText jp">保存証跡を端末へ返す</text>

    <path d="M277 292 H332" stroke="url(#report)" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M547 292 H602" stroke="url(#report)" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M827 292 H882" stroke="url(#report)" stroke-width="5" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Rescue lane boxes -->
  <g>
    <rect x="72" y="492" width="205" height="145" rx="18" fill="#38202A" stroke="#F59E0B"/>
    <text x="92" y="525" class="boxTitle">🆘 Create request</text>
    <text x="92" y="550" class="boxText jp">平文は作成境界だけ</text>
    <text x="92" y="572" class="boxText">AES-256-GCM payload</text>
    <text x="92" y="594" class="boxText">RSA-OAEP-256 key wrap</text>
    <text x="92" y="616" class="boxText jp">暗号化してから保存</text>

    <rect x="342" y="492" width="205" height="145" rx="18" fill="#38202A" stroke="#F59E0B"/>
    <text x="362" y="525" class="boxTitle">📲 Encrypted relay</text>
    <text x="362" y="550" class="boxText jp">Nearbyで暗号文だけを中継</text>
    <text x="362" y="572" class="boxText">Inventory • request • ACK</text>
    <text x="362" y="594" class="boxText">No courier private key</text>
    <text x="362" y="616" class="boxText jp">Courierは復号できない</text>

    <rect x="612" y="492" width="215" height="145" rx="18" fill="#38202A" stroke="#F59E0B"/>
    <text x="632" y="525" class="boxTitle">📡 Verified shelter BLE</text>
    <text x="632" y="550" class="boxText jp">署名済み地域台帳で照合</text>
    <text x="632" y="572" class="boxText">Opaque 16 KiB handoff</text>
    <text x="632" y="594" class="boxText">Idempotent retry</text>
    <text x="632" y="616" class="boxText jp">未信頼広告はfail-closed</text>

    <rect x="892" y="492" width="225" height="145" rx="18" fill="#38202A" stroke="#FB7185"/>
    <text x="912" y="525" class="boxTitle">🏥 Shelter / Gateway</text>
    <text x="912" y="550" class="boxText jp">避難所側だけが復号可能</text>
    <text x="912" y="572" class="boxText">Signed ECDSA receipt</text>
    <text x="912" y="594" class="boxText jp">受領証を端末側で検証</text>
    <text x="912" y="616" class="boxText">Stored • accepted • rejected</text>

    <path d="M277 566 H332" stroke="url(#rescue)" stroke-width="5" marker-end="url(#arrowOrange)"/>
    <path d="M547 566 H602" stroke="url(#rescue)" stroke-width="5" marker-end="url(#arrowOrange)"/>
    <path d="M827 566 H882" stroke="url(#rescue)" stroke-width="5" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- Optional boundaries -->
  <g>
    <rect x="710" y="88" width="205" height="62" rx="15" fill="#102D38" stroke="#22D3EE" stroke-dasharray="6 5"/>
    <text x="730" y="115" class="boxTitle">🌐 HTTPS priority feed</text>
    <text x="730" y="136" class="small">OPTIONAL • BOUNDED • HIGH/CRITICAL</text>
    <path d="M780 150 L745 218" stroke="#67E8F9" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>

    <rect x="935" y="88" width="182" height="62" rx="15" fill="#2A2535" stroke="#C4B5FD" stroke-dasharray="6 5"/>
    <text x="955" y="115" class="boxTitle">↗ Edge boundaries</text>
    <text x="955" y="136" class="small">MESHTASTIC • BPv7 • APPLE</text>
    <path d="M1025 150 L1020 205" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
  </g>

  <text x="60" y="724" class="small">STORAGE EVENT ≠ IDENTITY VERIFIED ≠ CONTENT VERIFIED ≠ FINAL DELIVERY</text>
  <text x="760" y="724" class="small jp">保存されたことと、内容の正しさ・最終到達は別です</text>
</svg>