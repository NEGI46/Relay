  Relayは119、消防・警察・自治体の公式な緊急連絡手段の代替ではありません。
  本ファイルのどの状態も、実災害での救助や自治体・消防の承認を保証しません。
disclaimer_en: >-
  Relay does not replace 119 or official emergency channels. No state in this
  file guarantees real-disaster rescue or municipal/fire-service approval.

