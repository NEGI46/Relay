# Relay readiness single source of truth.
#
# This file is the ONLY authoritative machine-readable record of what is
# implemented, what is automatically tested, and what is still blocked.
# README summary tables and the generated readiness documents are derived
# from this file; CI fails when they drift (tools/readiness/readiness_tool.py check).
#
# State axes are deliberately separate so that IMPLEMENTED can never be
# conflated with DEVICE_TESTED:
#   implementation:     NOT_IMPLEMENTED | IMPLEMENTED | DEPRECATED | BLOCKED_EXTERNAL
#   automated_test:     NOT_RUN | AUTOMATED_TESTED | BLOCKED_EXTERNAL | NOT_APPLICABLE
#   emulator_simulator: NOT_RUN | EMULATOR_TESTED | BLOCKED_EXTERNAL | NOT_APPLICABLE
#   real_device:        NOT_RUN | DEVICE_TESTED | BLOCKED_EXTERNAL | NOT_APPLICABLE
#   field_test:         NOT_RUN | FIELD_TESTED | BLOCKED_EXTERNAL | NOT_APPLICABLE
#
# DEVICE_TESTED / FIELD_TESTED additionally require dated external_record
# evidence; a code change or automated test can never set them.

